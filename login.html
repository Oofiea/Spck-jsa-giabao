<!DOCTYPE html>
<!-- The page is in English -->
<html lang="en">
<!-- Information about the page. This part is not shown on the page -->
<head>
  <!-- Use the UTF-8 text format so all letters show correctly -->
  <meta charset="UTF-8">
  <!-- Make the page fit phone screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The title shown in the browser tab -->
  <title>Log in - Reelhouse</title>
  <!-- Load the style file (colours, sizes and layout) -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<!-- Everything you can see on the page goes inside the body -->
<body>

  <!-- Navigation bar at the top -->
  <div class="navbar">
    <!-- The logo. Clicking it goes to the home page -->
    <a class="logo" href="index.html">Reelhouse</a>
    <!-- The links in the navigation bar -->
    <div class="nav-links">
      <!-- Link to the home page -->
      <a href="index.html">Home</a>
      <!-- Link to the Now showing section on the home page -->
      <a href="index.html#now-showing">Now showing</a>
      <!-- Link to the genre buttons on the home page -->
      <a href="index.html#genres">Genres</a>
      <!-- Link to the login page -->
      <a href="login.html">Log in</a>
      <!-- Gold button that goes to the register page -->
      <a class="nav-button" href="register.html">Create account</a>
    </div>
  </div>

  <!-- Page area that centres the login box -->
  <div class="form-page">
    <!-- The login box -->
    <div class="form-box">
      <!-- Heading -->
      <h1>Welcome back</h1>
      <!-- Short grey sentence under the heading -->
      <p class="intro">Log in to see your watchlist.</p>

      <!-- Empty message box. login.js shows errors and success messages here -->
      <p class="message" id="message" role="status" aria-live="polite"></p>

      <!-- Login form. login.js runs when it is sent -->
      <p class="demo-account-note">Demo account stored in this browser. Do not use a real password.</p><form id="login-form">
        <!-- Email field -->
        <label for="email">Email address</label>
        <!-- Email box. The browser checks that it looks like an email -->
        <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

        <!-- Password field -->
        <label for="password">Password</label>
        <!-- Password box. The letters are hidden -->
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>

        <!-- Button that sends the form -->
        <button class="button" type="submit">Log in</button>
      </form>

      <!-- Link to the register page for new users -->
      <p class="form-footer">New to Reelhouse? <a href="register.html">Create an account</a></p>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <!-- Copyright line -->
    <div class="copyright">&copy; 2026 Reelhouse. Movie data from TMDB.</div>
  </div>

  <!-- The script for this page. It must come last so the page is ready before it runs -->
  <script src="assets/js/login.js"></script>
</body>
</html>
